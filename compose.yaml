services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cashweft
      POSTGRES_PASSWORD: cashweft
      POSTGRES_DB: cashweft
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - cashweft-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashweft -d cashweft"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cashweft-postgres:
